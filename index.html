<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Travel Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #cde7ec;
        }
        #tooltip {
            position: absolute;
            display: none;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.2s;
        }
        .calendar-day {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Creates a square aspect ratio */
        }
        .calendar-day-content {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2 sm:p-4">
    <div class="w-full max-w-4xl bg-[#f8fafa] rounded-2xl shadow-2xl p-4 sm:p-6 md:p-8">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-[#00424a] mb-4 sm:mb-0 text-center">2026 Travel Planner</h1>
            <div class="flex items-center space-x-2">
                <button id="prev-month" class="p-2 rounded-full bg-[#dbf6fa] hover:bg-[#bac6ea] text-[#00424a] transition-colors duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                </button>
                <h2 id="month-year" class="text-xl sm:text-2xl font-semibold text-[#273f43] w-48 text-center">January 2026</h2>
                <button id="next-month" class="p-2 rounded-full bg-[#dbf6fa] hover:bg-[#bac6ea] text-[#00424a] transition-colors duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                </button>
            </div>
        </div>

        <!-- Calendar Grid -->
        <div>
            <div class="grid grid-cols-7 gap-1 text-center font-semibold text-[#2f3b58] mb-2 text-xs sm:text-base">
                <div>SUN</div>
                <div>MON</div>
                <div>TUE</div>
                <div>WED</div>
                <div>THU</div>
                <div>FRI</div>
                <div>SAT</div>
            </div>
            <div id="calendar-body" class="grid grid-cols-7 gap-1 sm:gap-2">
                <!-- Calendar days will be injected here by JavaScript -->
            </div>
        </div>

        <!-- Legend -->
        <div class="mt-6 pt-4 border-t border-[#bac6ea]">
            <h3 class="text-lg font-semibold text-[#00424a] mb-3 text-center sm:text-left">Legend</h3>
            <div class="flex flex-wrap justify-center sm:justify-start gap-x-6 gap-y-2">
                <div class="flex items-center space-x-2">
                    <div class="w-4 h-4 rounded-full bg-[#facc15]"></div>
                    <span class="text-sm text-[#273f43]">School Break</span>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="w-4 h-4 rounded-full bg-[#60a5fa]"></div>
                    <span class="text-sm text-[#273f43]">Long Weekend</span>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="w-4 h-4 rounded-full bg-[#de3730]"></div>
                    <span class="text-sm text-[#273f43]">Public Holiday</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div id="tooltip" class="bg-[#2f3b58] text-white text-sm rounded-lg py-1.5 px-3 shadow-lg"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const monthYearEl = document.getElementById('month-year');
            const calendarBodyEl = document.getElementById('calendar-body');
            const prevMonthBtn = document.getElementById('prev-month');
            const nextMonthBtn = document.getElementById('next-month');
            const tooltipEl = document.getElementById('tooltip');

            let currentDate = new Date(2026, 0, 1);

            const events = [
                // Public Holidays (Lowest Priority)
                { start: '2026-01-01', end: '2026-01-01', name: 'Public Holiday: New Year\'s Day', type: 'publicHoliday' },
                { start: '2026-01-19', end: '2026-01-19', name: 'Public Holiday: Martin Luther King, Jr. Day', type: 'publicHoliday' },
                { start: '2026-02-16', end: '2026-02-16', name: 'Public Holiday: Presidents\' Day', type: 'publicHoliday' },
                { start: '2026-05-25', end: '2026-05-25', name: 'Public Holiday: Memorial Day', type: 'publicHoliday' },
                { start: '2026-07-03', end: '2026-07-03', name: 'Public Holiday: Independence Day (Observed)', type: 'publicHoliday' },
                { start: '2026-07-04', end: '2026-07-04', name: 'Public Holiday: Independence Day', type: 'publicHoliday' },
                { start: '2026-09-07', end: '2026-09-07', name: 'Public Holiday: Labor Day', type: 'publicHoliday' },
                { start: '2026-11-26', end: '2026-11-26', name: 'Public Holiday: Thanksgiving Day', type: 'publicHoliday' },
                { start: '2026-12-25', end: '2026-12-25', name: 'Public Holiday: Christmas Day', type: 'publicHoliday' },

                // Long Weekends (Medium Priority)
                { start: '2026-01-01', end: '2026-01-04', name: 'Long Weekend: New Year\'s', type: 'longWeekend' },
                { start: '2026-01-10', end: '2026-01-12', name: 'Long Weekend: SIP/Teacher Work Day', type: 'longWeekend' },
                { start: '2026-01-17', end: '2026-01-19', name: 'Long Weekend: MLK Day', type: 'longWeekend' },
                { start: '2026-02-14', end: '2026-02-16', name: 'Long Weekend: Presidents\' Day', type: 'longWeekend' },
                { start: '2026-02-27', end: '2026-03-01', name: 'Long Weekend: Institute Day', type: 'longWeekend' },
                { start: '2026-03-14', end: '2026-03-16', name: 'Long Weekend: Parent/Teacher Conferences', type: 'longWeekend' },
                { start: '2026-03-28', end: '2026-04-06', name: 'Long Weekend: Extended Spring Break', type: 'longWeekend' },
                { start: '2026-05-23', end: '2026-05-25', name: 'Long Weekend: Memorial Day', type: 'longWeekend' },
                { start: '2026-07-03', end: '2026-07-05', name: 'Long Weekend: Independence Day', type: 'longWeekend' },
                { start: '2026-09-05', end: '2026-09-07', name: 'Long Weekend: Labor Day', type: 'longWeekend' },
                { start: '2026-11-26', end: '2026-11-29', name: 'Long Weekend: Thanksgiving', type: 'longWeekend' },
                { start: '2026-12-24', end: '2026-12-27', name: 'Long Weekend: Christmas', type: 'longWeekend' },
                { start: '2026-12-31', end: '2027-01-03', name: 'Long Weekend: New Year\'s Eve/Day', type: 'longWeekend' },

                // School Breaks (Highest Priority)
                { start: '2026-01-01', end: '2026-01-02', name: 'School Break: Winter Break', type: 'schoolBreak' },
                { start: '2026-03-30', end: '2026-04-03', name: 'School Break: Spring Break', type: 'schoolBreak' },
            ];

            const finalDateStyles = {};
            const priorityOrder = ['publicHoliday', 'longWeekend', 'schoolBreak'];

            priorityOrder.forEach(type => {
                const filteredEvents = events.filter(e => e.type === type);
                filteredEvents.forEach(event => {
                    let loopDate = new Date(event.start + 'T12:00:00Z');
                    const endDate = new Date(event.end + 'T12:00:00Z');
                    while (loopDate <= endDate) {
                        const dateString = loopDate.toISOString().split('T')[0];
                        finalDateStyles[dateString] = { name: event.name, type: event.type };
                        loopDate.setDate(loopDate.getDate() + 1);
                    }
                });
            });

            const colorClasses = {
                schoolBreak: 'bg-[#facc15] text-[#393c3d]',
                longWeekend: 'bg-[#60a5fa] text-[#f8fafa]',
                publicHoliday: 'bg-[#de3730] text-[#f8fafa]'
            };

            function renderCalendar() {
                calendarBodyEl.innerHTML = '';
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();

                monthYearEl.textContent = `${currentDate.toLocaleString('default', { month: 'long' })} ${year}`;

                const firstDayOfMonth = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                for (let i = 0; i < firstDayOfMonth; i++) {
                    calendarBodyEl.insertAdjacentHTML('beforeend', `<div class="calendar-day"></div>`);
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const cellDate = new Date(year, month, day);
                    const dateString = cellDate.toISOString().split('T')[0];
                    const today = new Date();
                    
                    let classes = 'calendar-day-content flex items-center justify-center text-sm sm:text-base rounded-lg cursor-default transition-transform duration-200 hover:scale-110 hover:z-10';
                    let tooltipText = '';

                    const event = finalDateStyles[dateString];
                    if (event) {
                        classes += ` ${colorClasses[event.type]} font-bold`;
                        tooltipText = event.name;
                    } else {
                        classes += ' text-[#273f43]';
                    }

                    if (cellDate.setHours(0,0,0,0) === today.setHours(0,0,0,0)) {
                        classes += ' ring-2 ring-[#00424a]';
                    }

                    const dayCellHTML = `
                        <div class="calendar-day">
                            <div class="${classes}" data-tooltip="${tooltipText}">
                                ${day}
                            </div>
                        </div>
                    `;
                    calendarBodyEl.insertAdjacentHTML('beforeend', dayCellHTML);
                }
                
                document.querySelectorAll('.calendar-day-content[data-tooltip]').forEach(cell => {
                    cell.addEventListener('mousemove', (e) => {
                        if (cell.dataset.tooltip) {
                            tooltipEl.style.display = 'block';
                            tooltipEl.textContent = cell.dataset.tooltip;
                            tooltipEl.style.left = `${e.pageX + 15}px`;
                            tooltipEl.style.top = `${e.pageY + 15}px`;
                        }
                    });
                    cell.addEventListener('mouseleave', () => {
                        tooltipEl.style.display = 'none';
                    });
                });

                updateNavButtons();
            }

            function updateNavButtons() {
                const month = currentDate.getMonth();
                prevMonthBtn.disabled = month === 0;
                nextMonthBtn.disabled = month === 11;
                prevMonthBtn.classList.toggle('opacity-50', month === 0);
                nextMonthBtn.classList.toggle('opacity-50', month === 11);
                prevMonthBtn.classList.toggle('cursor-not-allowed', month === 0);
                nextMonthBtn.classList.toggle('cursor-not-allowed', month === 11);
            }

            prevMonthBtn.addEventListener('click', () => {
                if (currentDate.getMonth() > 0) {
                    currentDate.setMonth(currentDate.getMonth() - 1);
                    renderCalendar();
                }
            });

            nextMonthBtn.addEventListener('click', () => {
                if (currentDate.getMonth() < 11) {
                    currentDate.setMonth(currentDate.getMonth() + 1);
                    renderCalendar();
                }
            });

            renderCalendar();
        });
    </script>
</body>
</html>
